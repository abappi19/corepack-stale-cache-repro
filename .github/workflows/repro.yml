name: repro
on: [push, workflow_dispatch]
jobs:
  reproduces-bug:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # repro.sh exits 1 when the bug reproduces, so this job is green while the bug exists.
      - run: "! ./repro.sh"
